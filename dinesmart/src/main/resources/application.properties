# ===== Server =====
server.port=8080
server.forward-headers-strategy=native
# Tên khóa theo cảnh báo của IDE (Spring Boot 4). Nếu dùng Spring Boot 3.x thì đổi thành server.error.include-message / server.error.include-stacktrace
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.application.name=dinesmart

# ===== Database =====
# Nên kết nối bằng user thuộc ROLE app_rw (xem mục 9b trong file SQL), KHÔNG dùng sa khi triển khai.
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:dinesmart_db};encrypt=true;trustServerCertificate=${DB_TRUST_CERT:true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:12345678Aa}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2

# ===== JPA =====
spring.jpa.open-in-view=false
# Schema do file SQL quản lý
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.format_sql=false

# ===== Jackson / upload / static =====
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.web.resources.cache.cachecontrol.max-age=1h

# ===== Ứng dụng =====
app.timezone=Asia/Ho_Chi_Minh
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080,http://localhost:5173}

# JWT: secret >= 32 ký tự. Sinh bằng: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=14
# Bật true khi chạy HTTPS
app.jwt.cookie-secure=${COOKIE_SECURE:false}

app.security.max-failed-logins=5
app.security.lock-minutes=15
app.security.reset-token-minutes=30

# Nếu đặt admin-password, lúc khởi động sẽ gán mật khẩu này (BCrypt) cho admin-email và bật tài khoản.
app.bootstrap.admin-email=admin@dinesmart.local
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Chưa tích hợp SMTP: link đặt lại mật khẩu được ghi vào log (CHỈ bật khi phát triển).
app.mail.log-reset-link=${LOG_RESET_LINK:true}
app.mail.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

app.upload.dir=${UPLOAD_DIR:./uploads}

# ===== Gemini =====
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# gemini-2.5-flash bị Google chuyển hướng từ 01/12/2026 -> dùng model thế hệ mới, đổi bằng biến môi trường GEMINI_MODEL
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.gemini.timeout-seconds=30
app.gemini.max-tool-rounds=5
app.gemini.max-history-messages=20

app.housekeeping.enabled=true
app.housekeeping.interval-ms=60000

# ===== Actuator / log =====
management.endpoints.web.exposure.include=health,info
logging.level.datn.nht.dinesmart=INFO